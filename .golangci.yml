version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        # Defaults: drop style-only checks.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Explicit selectors through embedded fields (e.g. w.Server.ID) are
        # clearer here than the shortened form.
        - -QF1008
